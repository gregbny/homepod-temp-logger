services:
  homepod-temp-logger:
    build: .
    # Or use the prebuilt image instead of building:
    # image: ghcr.io/gregbny/homepod-temp-logger:latest
    container_name: homepod-temp-logger
    restart: unless-stopped
    ports:
      - "8088:8088"          # host:container — the POST URL is http://SERVER_IP:8088
      - "2222:2222"          # optional SSH ingestion (OS 27 hubs workaround)
    volumes:
      - ./data:/data         # .db persistence (on Unraid: /mnt/user/appdata/homepod-temp-logger)
    environment:
      PORT: "8088"
      DB_PATH: "/data/homepod.db"
      RETENTION_DAYS: "0"    # 0 = unlimited history; e.g. 365 to prune beyond a year
      SSH_PORT: "2222"       # SSH ingestion; "0" = off. Not a shell: it only stores readings
      SSH_PASSWORD: "${SSH_PASSWORD:-}"  # empty = any login (like the HTTP endpoint)
      # Optional outdoor weather (Open-Meteo, free, no API key) drawn behind the
      # indoor curves. Easiest: set the location in the dashboard ("Outdoor
      # weather" card) — it's saved in ./data and survives updates. To pin it
      # here instead, put WEATHER_LAT=… and WEATHER_LON=… in a .env file next to
      # this compose file (git-ignored, so a git pull never touches it); these
      # then override the dashboard. Unset = 100% local, no outbound request.
      WEATHER_LAT: "${WEATHER_LAT:-}"
      WEATHER_LON: "${WEATHER_LON:-}"
